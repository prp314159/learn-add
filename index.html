<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Learn to Add</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learn to Add">
<meta name="theme-color" content="#fff6e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --u: 80px;               /* one layout unit, set from the screen size in fit() */
    --a: calc(var(--u) * 1.05); /* size of one object on the tray */
    --bg: #fff6e5;
    --ink: #4a3a2a;
    --wood: #c8935a;
    --cell: #f6e2bf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    touch-action: manipulation; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  }
  body { position: fixed; inset: 0; }
  button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; touch-action: manipulation; }

  #app {
    position: absolute; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #fit { position: relative; width: 100%; height: 100%; }

  /* ---------- board ---------- */
  #board {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: grid; grid-template-columns: auto auto; grid-template-areas: "modes meta" "scene scene";
  }
  #modes { grid-area: modes; justify-self: start; display: flex; align-items: center; gap: calc(var(--u) * .2); height: calc(var(--u) * 1.1); }
  #meta  { grid-area: meta; justify-self: end; display: flex; align-items: center; gap: calc(var(--u) * .3); height: calc(var(--u) * 1.1); }
  #scene { grid-area: scene; width: calc(var(--u) * 12); }

  /* a wide, low screen (a phone on its side): the bar moves to the two sides */
  body.wide #board { grid-template-columns: auto auto auto; grid-template-areas: "modes scene meta"; column-gap: calc(var(--u) * .25); }
  body.wide #modes, body.wide #meta { flex-direction: column; height: auto; align-self: start; justify-self: center; padding-top: calc(var(--u) * .2); }
  body.wide #stars { flex-direction: column; }

  .mode {
    width: var(--u); height: var(--u); border-radius: 28%; font-size: calc(var(--u) * .56); line-height: 1;
    background: #ffffff88; box-shadow: 0 calc(var(--u) * .05) 0 #0001; opacity: .6;
    transition: transform .15s, opacity .15s, background .15s;
  }
  .mode.on { background: #fff; opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 calc(var(--u) * .06) #ffb74d, 0 calc(var(--u) * .06) 0 #0002; }

  #stars { display: flex; gap: calc(var(--u) * .06); font-size: calc(var(--u) * .5); line-height: 1; }
  #stars span { filter: grayscale(1); opacity: .25; transition: filter .2s, opacity .2s; }
  #stars span.got { filter: none; opacity: 1; }

  /* the parent dial: press and hold */
  #dial {
    position: relative; width: calc(var(--u) * .62); height: calc(var(--u) * .62); border-radius: 50%;
    font-size: calc(var(--u) * .3); font-weight: 800; color: #a08c74; background: #0000000d; overflow: hidden;
  }
  #dial::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #ffb74d; transform: scale(0); }
  #dial.holding::before { transform: scale(1); transition: transform .9s linear; }
  #dial span { position: relative; }

  /* ---------- the sentence and the two groups ---------- */
  #top { display: flex; flex-direction: column; }
  #sentence, #zones {
    display: grid; justify-items: center; align-items: center;
    grid-template-columns: calc(var(--u) * 4.25) calc(var(--u) * .9) calc(var(--u) * 4.25) calc(var(--u) * .9) calc(var(--u) * 1.7);
  }
  #sentence { height: calc(var(--u) * 1.1); }
  #zones { height: calc(var(--u) * 1.8); }
  /* Play: the numbers describe the tray, not the boxes, so the sentence sits right above the tray */
  body.play #zones { order: 1; }
  body.play #sentence { order: 2; display: flex; justify-content: center; gap: calc(var(--u) * .3); }
  .chip {
    min-width: calc(var(--u) * .95); height: calc(var(--u) * .95); padding: 0 calc(var(--u) * .2); border-radius: calc(var(--u) * .5);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * .68); font-weight: 800; line-height: 1;
    background: #fff; color: var(--ink); box-shadow: 0 calc(var(--u) * .04) 0 #0002;
  }
  .chip.ask { background: transparent; box-shadow: none; border: calc(var(--u) * .05) dashed #b9a58b; color: #b9a58b; }
  .chip.gone { opacity: .55; }   /* take away: the number of the gone cars is faded, like them */
  .sign { font-size: calc(var(--u) * .7); font-weight: 800; color: #8a7760; line-height: 1; }
  .hide { visibility: hidden; }
  .zone { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* A supply is a closed box with one object peeking out. It must never look like a group he could count. */
  .pile { position: relative; width: calc(var(--u) * 2.1); height: calc(var(--u) * 1.7); }
  .pile .peek { position: absolute; left: 0; right: 0; top: calc(var(--u) * -.1); text-align: center; font-size: calc(var(--u) * .95); line-height: 1; }
  .pile .box {
    position: absolute; left: 0; right: 0; bottom: calc(var(--u) * .08); height: calc(var(--u) * 1);
    border-radius: calc(var(--u) * .12) calc(var(--u) * .12) calc(var(--u) * .26) calc(var(--u) * .26);
    background: var(--c); box-shadow: 0 calc(var(--u) * .08) 0 #0003, inset 0 calc(var(--u) * -.12) 0 #00000022;
  }
  .pile .box::before {
    content: ""; position: absolute; left: calc(var(--u) * -.08); right: calc(var(--u) * -.08); top: 0; height: calc(var(--u) * .24);
    border-radius: calc(var(--u) * .1); background: var(--c); box-shadow: 0 calc(var(--u) * .04) 0 #00000033, inset 0 0 0 100px #ffffff2e;
  }

  /* ---------- the tray ---------- */
  #trayWrap { position: relative; height: calc(var(--u) * 2.85); display: flex; align-items: center; justify-content: center; }
  #tray {
    display: grid; grid-template-columns: repeat(5, calc(var(--u) * 1.25)); grid-auto-rows: calc(var(--u) * 1.25);
    padding: calc(var(--u) * .15); border-radius: calc(var(--u) * .3); background: var(--wood);
    box-shadow: 0 calc(var(--u) * .08) 0 #8f6236, 0 calc(var(--u) * .2) calc(var(--u) * .3) #0002;
  }
  .cell { margin: calc(var(--u) * .06); border-radius: calc(var(--u) * .2); background: var(--cell); box-shadow: inset 0 calc(var(--u) * .05) 0 #0000001a; }
  .cell.glow { animation: glow .9s ease-out; }
  @keyframes glow { 0% { background: #fff; box-shadow: 0 0 calc(var(--u) * .5) #ffd54f; } 100% { background: var(--cell); } }
  #tumble {
    position: absolute; right: calc(var(--u) * .5); top: 50%; transform: translateY(-50%);
    width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; font-size: calc(var(--u) * .6); line-height: 1;
    background: #fff; box-shadow: 0 calc(var(--u) * .06) 0 #0002;
  }
  #tumble:active { transform: translateY(-46%); }

  /* ---------- the number row ---------- */
  #numrow { height: calc(var(--u) * 1.45); display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * .12); transition: opacity .2s; }
  #numrow button {
    width: var(--u); height: var(--u); border-radius: 24%; background: #fff;
    font-size: calc(var(--u) * .56); font-weight: 800; line-height: 1;
    box-shadow: 0 calc(var(--u) * .07) 0 #d9c7ab;
  }
  /* Level A: bigger and wider apart than the tray places, so the last object never points at its button */
  #numrow.a { gap: calc(var(--u) * .5); }
  #numrow.a button { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); font-size: calc(var(--u) * .7); }
  /* Level B of take away: eleven buttons, 0 to 10, a twentieth smaller so that they fit across the scene */
  #numrow.eleven { gap: calc(var(--u) * .1); }
  #numrow.eleven button { width: calc(var(--u) * .95); height: calc(var(--u) * .95); font-size: calc(var(--u) * .53); }
  #numrow.inert { pointer-events: none; opacity: .45; }
  #numrow button.good { background: #c8f1c1; box-shadow: 0 calc(var(--u) * .07) 0 #8fcf85; }
  #numrow button.soft { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6%); } 50% { transform: translateX(6%); } 75% { transform: translateX(-4%); } }

  /* ---------- the objects ---------- */
  #layer { position: absolute; inset: 0; pointer-events: none; }
  .apple {
    position: absolute; left: 0; top: 0; width: var(--a); height: var(--a);
    margin: calc(var(--a) / -2) 0 0 calc(var(--a) / -2);
    pointer-events: auto; will-change: transform;
  }
  .apple .face { display: block; width: 100%; height: 100%; text-align: center; font-size: calc(var(--a) * .8); line-height: var(--a); }
  .apple .num {
    position: absolute; left: 50%; top: 50%; width: 66%; height: 66%; margin: -33% 0 0 -33%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
    background: #fffffff0; font-size: calc(var(--a) * .46); font-weight: 800; box-shadow: 0 2px 6px #0003;
  }
  /* take away: a gone car is the same car, a little faded, in a waiting place under the number that must go */
  .apple.gone { opacity: .55; }
  .place {
    position: absolute; left: 0; top: 0; width: var(--a); height: var(--a);
    margin: calc(var(--a) / -2) 0 0 calc(var(--a) / -2); border-radius: 50%;
    border: calc(var(--u) * .06) dashed #c4b195; pointer-events: none; will-change: transform;
  }
  #big {
    position: absolute; left: 0; top: 0; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); margin: calc(var(--u) * -1.3) 0 0 calc(var(--u) * -1.3);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
    background: #fffffff2; font-size: calc(var(--u) * 1.9); font-weight: 800; box-shadow: 0 4px 24px #0003;
  }
  #hand { position: absolute; left: 0; top: 0; font-size: var(--u); line-height: 1; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .bit { position: absolute; left: 0; top: 0; pointer-events: none; line-height: 1; }

  /* ---------- overlays ---------- */
  #trophy { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .3); background: #fff6e5ee; overflow: hidden; }
  #trophy.on { display: flex; }
  #trophy .cup { font-size: calc(var(--u) * 3.2); line-height: 1; animation: cup 1s ease-in-out infinite alternate; }
  #trophy .go { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); border-radius: 50%; background: #fff; font-size: calc(var(--u) * .7); box-shadow: 0 calc(var(--u) * .08) 0 #0002; }
  @keyframes cup { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(6deg) scale(1.08); } }

  #turn { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--bg); font-size: 120px; z-index: 10; }
  #turn span { animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 600px) { #turn { display: flex; } }
</style>
</head>
<body>
<div id="app"><div id="fit">
  <div id="board">
    <div id="modes">
      <button class="mode" data-mode="play" aria-label="Play">✋</button>
      <button class="mode" data-mode="ask" aria-label="How many?">➕</button>
      <button class="mode" data-mode="take" aria-label="How many left?">➖</button>
    </div>
    <div id="meta">
      <div id="stars" aria-hidden="true"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <button id="dial" aria-label="Level, press and hold to change"><span>A</span></button>
    </div>
    <div id="scene">
      <div id="top">
        <div id="sentence"><div class="chip" id="n1"></div><div class="sign" id="op">+</div><div class="chip" id="n2"></div><div class="sign" id="eq">=</div><div class="chip" id="total"></div></div>
        <div id="zones"><div class="zone" id="zone1"></div><div></div><div class="zone" id="zone2"></div><div></div><div></div></div>
      </div>
      <div id="trayWrap">
        <div id="tray"></div>
        <button id="tumble" aria-label="Tip everything off the tray">🌪️</button>
      </div>
      <div id="numrow"></div>
    </div>
  </div>
  <div id="layer"><div id="big"></div><div id="hand">👆</div></div>
  <div id="trophy"><div class="cup">🏆</div><button class="go" aria-label="Again">▶️</button></div>
  <div id="turn"><span>📱</span></div>
</div></div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- the objects: two colours of one kind of thing ----------
   Put what he loves first. The object changes after every trophy, never inside one sum.
   Red and blue or red and yellow, never red and green. */
const SETS = [
  { e: ['🚗', '🚙'], bg: ['#e53935', '#1e88e5'], fg: ['#fff', '#fff'] },
  { e: ['❤️', '💛'], bg: ['#e53935', '#fbc02d'], fg: ['#fff', '#4a3500'] },
  { e: ['📕', '📘'], bg: ['#e53935', '#1e88e5'], fg: ['#fff', '#fff'] },
  { e: ['🔴', '🟡'], bg: ['#e53935', '#fbc02d'], fg: ['#fff', '#4a3500'] },
];
let setIdx = 0;
const set = () => SETS[setIdx];

/* ---------- which sums, in what order ---------- */
const one = (a, b) => [{ a, b, c1: 0, c2: 1 }];
// A turn-around pair, back to back. The colour stays with the quantity, so the second tray mirrors the first.
const pair = (a, b) => [{ a, b, c1: 0, c2: 1 }, { a: b, b: a, c1: 1, c2: 0 }];
// Take away: w on the tray, and t of them go. At least 1 goes, and all of them may go ("all gone": the answer is 0).
const away = (w, t) => [{ w, t }];
// The other part, back to back: the same whole, the other part leaves, and the two answers swap.
const other = (w, t) => [{ w, t }, { w, t: w - t }];
const PASS = {
  add: {
    A: [one(1, 1), one(2, 1), one(3, 1), one(4, 1),      // plus one
        pair(3, 1), pair(2, 1), pair(4, 1),              // turn-arounds
        one(2, 2), pair(3, 2)],                          // plus two and the double
    B: [one(6, 1), pair(8, 1), pair(7, 2),               // plus one and plus two, a sample only
        pair(5, 1), pair(5, 2), pair(5, 3), pair(5, 4), one(5, 5),   // five and some more
        one(3, 3), pair(3, 4), one(4, 4), pair(4, 5),    // doubles, each with its near double
        pair(9, 1), pair(8, 2), pair(7, 3), pair(6, 4),  // tens pairs
        pair(3, 6)],
  },
  take: {
    A: [away(2, 1), away(3, 1), away(4, 1), away(5, 1),  // take away one: one fewer is the number before
        away(3, 3),                                      // all gone, once: he meets the 0 button
        away(3, 2), away(4, 2), away(5, 2),              // take away two
        other(5, 2), other(4, 1), other(5, 1),           // the other part, back to back
        away(5, 5)],                                     // the full row, all gone
    B: [away(7, 1), away(9, 1), away(8, 2), away(6, 2), away(6, 6),         // take away one and two, and one all gone, a sample only
        other(6, 1), other(7, 2), other(8, 3), other(9, 4), away(10, 5),    // five and some more, undone
        away(6, 3), away(8, 4), other(7, 3),                                // halves and near halves
        other(10, 1), other(10, 2), other(10, 3), other(10, 4), away(10, 10)],   // from ten: the tens pairs undone, then all gone
  },
};
function poolAdd(level) {
  const out = [];
  for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++) {
    const t = a + b;
    if (level === 'A' ? t <= 5 : (t >= 6 && t <= 10)) out.push({ a, b, c1: 0, c2: 1 });
  }
  return out;
}
// Every take-away fact of the level: the whole is 2 to 5, or 6 to 10, and from 1 to all of it goes.
function poolTake(level) {
  const out = [];
  for (let w = level === 'A' ? 2 : 6; w <= (level === 'A' ? 5 : 10); w++) for (let t = 1; t <= w; t++) out.push({ w, t });
  return out;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

/* ---------- what is remembered: his place in the sums and the parent dial, per game ---------- */
const KEY = 'learn-add-v1';
const store = (() => {
  const s = { add: { level: 'A', pos: { A: 0, B: 0 } }, take: { level: 'A', pos: { A: 0, B: 0 } } };
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j) {
      // the first version saved one level and one place: they were the addition's
      const parts = { add: j.add || (j.level ? { level: j.level, pos: j.pos } : null), take: j.take };
      for (const k in parts) {
        const v = parts[k]; if (!v) continue;
        if (v.level === 'B') s[k].level = 'B';
        if (v.pos) { s[k].pos.A = v.pos.A | 0; s[k].pos.B = v.pos.B | 0; }
      }
    }
  } catch (e) {}
  return s;
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

// The two question games, each with its own facts, its own place in them, its own level on the dial, and its own
// sequence state (the place in a pair, the comebacks, the shuffle bag), so nothing is lost when he switches games.
const newSeq = () => ({ sub: 0, last: null, forced: null, bag: [], comeback: [], fromPass: false });
const games = {
  ask:  { mem: store.add,  PASS: PASS.add,  pool: poolAdd,  seq: newSeq(), partner: s => ({ a: s.b, b: s.a, c1: 1, c2: 0 }) },
  take: { mem: store.take, PASS: PASS.take, pool: poolTake, seq: newSeq(), partner: s => ({ w: s.w, t: s.w - s.t }) },
};
const sameSum = (s, t) => s.a === t.a && s.b === t.b && s.w === t.w && s.t === t.t;
function resetSeq(g) { Object.assign(g.seq, newSeq(), { last: g.seq.last }); }

function draw(g) {
  const q = g.seq;
  if (!q.bag.length) q.bag = shuffle(g.pool(g.mem.level));
  let s = q.bag.pop();
  if (q.last && sameSum(s, q.last) && q.bag.length) { const t = q.bag.pop(); q.bag.unshift(s); s = t; }
  // a turn-around, or the other part, now and then. All gone has no other part: nothing is taken from nothing.
  const p = g.partner(s);
  if (p.t !== 0 && !sameSum(p, s) && Math.random() < .3) q.forced = p;
  return s;
}
function nextSum(g) {
  const q = g.seq, L = g.mem.level, pass = g.PASS[L];
  q.comeback.forEach(c => c.due--);
  let s;
  if (q.sub === 0 && !q.forced && q.comeback.length && q.comeback[0].due <= 0) {
    s = q.comeback.shift().sum; q.fromPass = false;
  } else if (g.mem.pos[L] < pass.length) {
    s = pass[g.mem.pos[L]][q.sub]; q.fromPass = true;
  } else if (q.forced) {
    s = q.forced; q.forced = null; q.fromPass = false;
  } else {
    s = draw(g); q.fromPass = false;
  }
  q.last = s;
  return s;
}
function sumSolved(g, neededNumbers) {
  const q = g.seq, L = g.mem.level;
  if (neededNumbers) q.comeback.push({ sum: q.last, due: 3 });   // it comes back, so he gets to solve it by himself
  if (!q.fromPass) return;
  q.sub++;
  // his place is saved only between pairs, so a new session never starts in the middle of a turn-around
  if (q.sub >= g.PASS[L][g.mem.pos[L]].length) { q.sub = 0; g.mem.pos[L]++; save(); }
}

/* ---------- sound: small synthesised notes, and a few spoken words (see "voice" below) ---------- */
let AC = null, master = null;
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, { t = 0, dur = .5, type = 'triangle', vol = .5, to = 0 } = {}) {
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, s);
  if (to) o.frequency.exponentialRampToValueAtTime(to, s + dur);
  g.gain.setValueAtTime(.0001, s);
  g.gain.exponentialRampToValueAtTime(vol, s + .015);
  g.gain.exponentialRampToValueAtTime(.0001, s + dur);
  o.connect(g); g.connect(master); o.start(s); o.stop(s + dur + .05);
}
// Five notes (C D E G A), then the same again one octave up: the bottom row sounds like the top row.
const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00];
const freq = n => SCALE[(n - 1) % 5] * Math.pow(2, Math.floor((n - 1) / 5));
const sfx = {
  note(n)   { tone(freq(n), { dur: .55 }); tone(freq(n) * 2, { dur: .3, vol: .1, type: 'sine' }); },
  off(n)    { tone(freq(Math.max(1, n)) / 2, { dur: .3, vol: .4 }); },

  boop()    { tone(220, { dur: .3, type: 'sine', vol: .4, to: 150 }); },
  slide()   { tone(330, { dur: .25, type: 'sine', vol: .15, to: 520 }); },
  ting()    { tone(1568, { dur: .5, type: 'sine', vol: .3 }); tone(2093, { t: .08, dur: .5, type: 'sine', vol: .2 }); },
  sparkle() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, { t: i * .06, dur: .35, type: 'sine', vol: .22 })); },
  fanfare() { [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, { t: i * .12, dur: i === 4 ? 1 : .3, vol: .4 })); },

  tok()     { tone(140, { dur: .12, type: 'sine', vol: .4 }); },
  // quiet = the voice is speaking over it
  read(i, quiet) { const k = quiet ? .4 : 1; tone([523.25, 659.25, 783.99][i], { dur: .6, vol: .35 * k }); if (i === 2) tone(1046.5, { t: .05, dur: .8, vol: .25 * k }); },
};

// Optional number words in a parent's voice: sounds/1.m4a to sounds/10.m4a (or .mp3, .wav).
// They play only where a number is also shown: Play landings and the numbered count. Never on his own hops in "How many?".
const words = [];

  probe.addEventListener('canplaythrough', () => {
    for (let n = 1; n <= 10; n++) { const w = new Audio(`sounds/${n}.${exts[0]}`); w.preload = 'auto'; words[n] = w; }
  }, { once: true });

/* ---------- voice: the device's own voice, no files. SWITCHED OFF ----------
   It was tried and did not go well, so the app plays notes only, as it did before the voice was added.
   The code stays. With VOICE = true it speaks in two places only, where the words are the thing being
   taught: the read-back after a right answer ("three, and two, make five") and the numbered count after a
   second miss. Never on his own hops, and nothing in the app needs the voice to be understood.
   There is no setting for it on the screen, on purpose. */
const VOICE = false;
const SAYING = { and: 'and', make: 'make' };   // the other choice: 'plus' and 'equals'
const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const synth = VOICE ? (window.speechSynthesis || null) : null;
let voiceHeard = false, voiceFails = 0, utter = null;
// iOS can lose its voice for good if the app goes to the background in the middle of a word
if (synth) document.addEventListener('visibilitychange', () => { if (document.hidden) synth.cancel(); });
const voiceOn = () => !!synth && voiceFails < 2;
// iOS only lets a voice start from a touch. A silent word on the first touches opens the door for later.
function wakeVoice() {
  if (!synth || voiceHeard || synth.speaking || synth.pending) return;
  try { synth.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
}
// Says the parts in one breath ("three, and two, make five"), so the sentence keeps its natural tune.
// reach[i] settles as the voice gets to part i, done when it has finished. A voice that does not start
// settles everything at once, so it never holds the game up.
// The voice is set up exactly as in the clock app: US English, a little slow, nothing else. Picking a voice
// by hand, or changing the pitch, sounded odd.
function say(parts) {
  const open = [], reach = parts.map((p, i) => new Promise(r => { open[i] = r; }));
  let finish; const done = new Promise(r => { finish = r; });
  const timers = [], later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const all = () => { timers.forEach(clearTimeout); open.forEach(f => f()); finish(); };
  const out = { reach, done };
  if (!synth) { all(); return out; }
  const at = []; let pos = 0;
  parts.forEach(p => { at.push(pos); pos += p.length + 2; });
  let u;
  try { u = utter = new SpeechSynthesisUtterance(parts.join(', ')); } catch (e) { all(); return out; }   // kept in a variable, or some browsers drop it half way
  u.lang = 'en-US'; u.rate = .85;
  let started = false, bounds = false;
  const start = () => {
    if (started) return;
    started = true; voiceHeard = true; voiceFails = 0; open[0]();
    // Without word events from the voice, a part is taken to last about 0.9 seconds.
    parts.forEach((p, i) => { if (i) { later(() => { if (!bounds) open[i](); }, i * 900); later(open[i], i * 1600); } });
  };
  u.onstart = start;
  u.onboundary = e => { start(); bounds = true; at.forEach((c, i) => { if (e.charIndex >= c) open[i](); }); };
  u.onend = u.onerror = all;
  const waiting = voiceOn();
  try { synth.speak(u); } catch (e) { all(); return out; }
  if (!waiting) { all(); return out; }   // it failed twice in a row: still try, but the game keeps its own pace
  later(() => { if (!started) { voiceFails++; synth.cancel(); all(); } }, 800);   // the cancel also clears anything stuck in front of it
  later(all, 1500 + parts.length * 1300);

}
// A number word: the parent's recording if there is one, the device's voice if not.
function sayNumber(n) { return sayWord(n) ? sleep(0) : say([WORDS[n]]).done; }

/* ---------- layout ---------- */
const layer = $('#layer'), tray = $('#tray'), numrow = $('#numrow');
let U = 80, cells = [];
const apples = [];

function fit() {
  const f = $('#fit'), W = f.clientWidth, H = f.clientHeight;
  const wide = W / H > 1.85;
  document.body.classList.toggle('wide', wide);
  U = wide ? Math.min(W / 15.2, H / 7.4) : Math.min(W / 12.5, H / 8.6);
  document.documentElement.style.setProperty('--u', U + 'px');
  apples.forEach(a => setPos(a, where(a), 0));
  take.places.forEach((p, i) => { p.style.transform = T(placePos(i)); });
}
function rectIn(el) {
  const r = el.getBoundingClientRect(), L = layer.getBoundingClientRect();
  return { x: r.left - L.left, y: r.top - L.top, w: r.width, h: r.height };
}
const centre = el => { const r = rectIn(el); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; };
function trayPos(slot) { const c = centre(cells[slot]); return { x: c.x, y: c.y, s: 1 }; }
// A group at the top has the same shape as the tray: a row of 5, then the rest.
function homePos(zone, n, i) {
  const c = centre(zone), p = U * .84;
  if (n <= 5) return { x: c.x + (i - (n - 1) / 2) * p, y: c.y, s: .82 };
  return { x: c.x + ((i % 5) - 2) * p, y: c.y + (i < 5 ? -.5 : .5) * p, s: .82 };
}
function where(a) {
  if (a.at.t === 'tray') return trayPos(a.at.slot);
  if (a.at.t === 'home' || a.at.t === 'queued') return homePos(a.zone, a.n, a.i);
  if (a.at.t === 'place') return placePos(a.at.i);
  return a.pos;
}
function buildTray(rows) {
  tray.innerHTML = ''; cells = [];
  for (let i = 0; i < rows * 5; i++) { const c = document.createElement('div'); c.className = 'cell'; tray.appendChild(c); cells.push(c); }
}
// The buttons from..to. Level A's styling keys on the level, not on a count of buttons: take away has one more, the 0.
function buildNumrow(from, to, levelA) {
  numrow.innerHTML = ''; numrow.classList.toggle('a', levelA); numrow.classList.toggle('eleven', to - from >= 10);
  for (let i = from; i <= to; i++) { const b = document.createElement('button'); b.textContent = i; b.dataset.n = i; numrow.appendChild(b); }
}

/* ---------- objects on the screen ---------- */
const T = p => `translate(${p.x}px, ${p.y}px) scale(${p.s})`;
function makeApple(c) {
  const el = document.createElement('div'); el.className = 'apple';
  const face = document.createElement('span'); face.className = 'face'; face.textContent = set().e[c];
  const num = document.createElement('span'); num.className = 'num';
  el.append(face, num); layer.appendChild(el);
  const a = { el, face, num, c, at: { t: 'fly' }, pos: { x: 0, y: 0, s: 1 } };
  el._a = a; apples.push(a);
  return a;
}
function removeApple(a) { a.el.remove(); const i = apples.indexOf(a); if (i >= 0) apples.splice(i, 1); }
function clearApples() { apples.slice().forEach(removeApple); }
function setPos(a, p, ms) {
  a.pos = p;
  a.el.style.transition = ms ? `transform ${ms}ms cubic-bezier(.3, .7, .3, 1)` : 'none';
  a.el.style.transform = T(p);
}
// One hop along an arc. The promise settles when the object has landed.
function hop(a, p, ms = 360) {
  const from = a.pos, h = U * .9, frames = [];
  for (let k = 0; k <= 10; k++) {
    const t = k / 10;
    frames.push({ transform: T({ x: lerp(from.x, p.x, t), y: lerp(from.y, p.y, t) - 4 * h * t * (1 - t), s: lerp(from.s, p.s, t) }) });
  }
  setPos(a, p, 0);
  if (!a.el.animate) return sleep(ms);

}
const anim = (el, frames, opts) => el.animate ? el.animate(frames, opts) : null;
const squash = a => anim(a.face, [{ transform: 'scale(1.18, .82)' }, { transform: 'scale(.94, 1.06)' }, { transform: 'scale(1)' }], { duration: 220 });
const wiggle = el => anim(el, [{ transform: 'rotate(0)' }, { transform: 'rotate(-13deg)' }, { transform: 'rotate(11deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(0)' }], { duration: 320 });
const pulse = (el, k = 1.35, ms = 600) => anim(el, [{ transform: 'scale(1)' }, { transform: `scale(${k})` }, { transform: 'scale(1)' }], { duration: ms, easing: 'ease-in-out' });
const bounce = (a, ms) => anim(a.face, [{ transform: 'translateY(0) scale(1)' }, { transform: `translateY(${-U * .42}px) scale(1.12)` }, { transform: 'translateY(0) scale(1)' }], { duration: ms, easing: 'ease-in-out' });
const popIn = (a, delay) => anim(a.face, [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300, delay, fill: 'backwards' });
function showNum(a, n, ms) {
  a.num.textContent = n;
  anim(a.num, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1.1)', offset: .2 }, { opacity: 1, transform: 'scale(1)', offset: .7 }, { opacity: 0, transform: 'scale(1)' }], { duration: ms });
}
// The last number means all of them: one big numeral over the whole tray.
async function showBig(n) {
  const big = $('#big'), c = centre(tray);
  big.textContent = n; big.style.left = c.x + 'px'; big.style.top = c.y + 'px';
  anim(big, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.1)', offset: .15 }, { opacity: 1, transform: 'scale(1)', offset: .25 }, { opacity: 1, transform: 'scale(1)', offset: .8 }, { opacity: 0, transform: 'scale(1)' }], { duration: 1600 });
  await sleep(1600);
}

}
function bits(emoji, from, to, n = 6) {

    const b = document.createElement('div'); b.className = 'bit'; b.textContent = emoji; b.style.fontSize = U * .45 + 'px';
    layer.appendChild(b);
    const x = lerp(from.x, to.x, Math.random()), y = lerp(from.y, to.y, Math.random());
    const an = anim(b, [{ transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 1 }, { transform: `translate(${x}px, ${y - U * .5}px) scale(1.2)`, opacity: 1, offset: .4 }, { transform: `translate(${x}px, ${y - U}px) scale(.6)`, opacity: 0 }], { duration: 800, delay: k * 50, fill: 'backwards' });

    const b = document.createElement('div'); b.className = 'bit';
    b.style.cssText = `width:${U * .16}px;height:${U * .28}px;border-radius:3px;background:${cols[k % cols.length]}`;
    box.appendChild(b);

    if (an) an.onfinish = () => b.remove(); else b.remove();
  }

/* ---------- one queue: fast taps wait their turn, so things hop one at a time, in rhythm ---------- */
let gen = 0, Q = { chain: Promise.resolve(), pending: 0 };
function newGen() { gen++; Q = { chain: Promise.resolve(), pending: 0 }; if (synth) synth.cancel(); }
function enqueue(fn) {
  const q = Q, g = gen; q.pending++;
  q.chain = q.chain.then(async () => { if (g === gen) await fn(); })
    .catch(e => console.error(e))
    .then(() => { q.pending--; if (q === Q && q.pending === 0) { if (mode === 'ask') askIdle(); else if (mode === 'take') takeIdle(); } });
}

/* ---------- the sentence ---------- */
const chips = { n1: $('#n1'), n2: $('#n2'), total: $('#total'), op: $('#op'), eq: $('#eq') };
function paintChip(el, c) { el.style.background = set().bg[c]; el.style.color = set().fg[c]; el.classList.remove('ask'); }
function plainChip(el, askMark) { el.style.background = ''; el.style.color = ''; el.classList.toggle('ask', askMark); }

/* ==================== ✋ Play: no questions ==================== */
let mode = 'play';
const play = { list: [], reserved: 0, piles: [] };
const peek = c => play.piles[c].firstChild;

function buildPiles() {
  play.piles = [0, 1].map(c => {
    const zone = $(c ? '#zone2' : '#zone1');
    const p = document.createElement('button'); p.className = 'pile'; p.dataset.c = c;
    p.style.setProperty('--c', set().bg[c]);
    p.innerHTML = '<span class="peek"></span><span class="box"></span>'; p.firstChild.textContent = set().e[c];
    zone.innerHTML = ''; zone.appendChild(p);
    return p;
  });
}
function playSentence(landed) {
  const r = play.list.filter(a => a.c === 0).length, y = play.list.length - r, both = r > 0 && y > 0;
  chips.n1.textContent = r; chips.n2.textContent = y; chips.total.textContent = r + y;
  chips.n1.classList.toggle('hide', !r); chips.n2.classList.toggle('hide', !y);
  [chips.op, chips.eq, chips.total].forEach(el => el.classList.toggle('hide', !both));   // one colour shows just "3", never "3 + 0"
  if (landed) pulse(both ? chips.total : (r ? chips.n1 : chips.n2), 1.3, 350);
}
// The tray keeps itself tidy: no holes, colours together, so the rows of 5 stay true.
function playTidy() {
  play.list.sort((p, q) => p.c - q.c);
  play.list.forEach((a, i) => { if (a.at.slot !== i) { a.at = { t: 'tray', slot: i }; setPos(a, trayPos(i), 260); } });
}
function playAdd(c) {
  if (play.reserved >= 10) { wiggle(play.piles[c]); sfx.tok(); return; }
  play.reserved++;
  anim(peek(c), [{ transform: 'translateY(0)' }, { transform: `translateY(${-U * .25}px)` }, { transform: 'translateY(0)' }], { duration: 200 });
  enqueue(async () => {
    const a = makeApple(c), from = centre(peek(c));
    setPos(a, { x: from.x, y: from.y, s: .78 }, 0);
    const slot = play.list.length;                       // it lands in the next free place, then slides to its colour
    await hop(a, trayPos(slot), 340);
    a.at = { t: 'tray', slot }; play.list.push(a);
    squash(a); sfx.note(play.list.length); sayWord(play.list.length);
    playTidy(); playSentence(true);
    if (play.list.length === 5) { sfx.sparkle(); glowCells(0, 5); bits('✨', centre(cells[0]), centre(cells[4])); }
    if (play.list.length === 10) { sfx.fanfare(); glowCells(0, 10); bits('✨', centre(cells[0]), centre(cells[9]), 12); }
  });
}
function playRemove(a) {
  if (a.leaving) return;
  a.leaving = true; play.reserved--;
  enqueue(async () => {
    const i = play.list.indexOf(a); if (i >= 0) play.list.splice(i, 1);
    a.at = { t: 'fly' };
    sfx.off(play.list.length); playTidy(); playSentence(false);
    const to = centre(peek(a.c));
    await hop(a, { x: to.x, y: to.y, s: .5 }, 300);
    removeApple(a);
  });
}
function playTumble() {
  enqueue(async () => {
    const all = play.list.splice(0); if (!all.length) return;
    play.reserved -= all.length; sfx.tumble(); playSentence(false);
    all.forEach((a, k) => {
      a.leaving = true; a.at = { t: 'fly' };
      const spin = (Math.random() - .5) * 600;
      anim(a.face, [{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: `translateY(${U * 4}px) rotate(${spin}deg)`, opacity: 0 }], { duration: 600, delay: k * 35, easing: 'ease-in', fill: 'both' });
    });
    await sleep(650 + all.length * 35);
    all.forEach(removeApple);
  });

/* ==================== ➕ How many? ==================== */
const ask = { sum: null, apples: [], total: 0, onTray: 0, misses: 0, busy: false, tidying: false, pending: null, run: 0, runTimer: 0 };
let stars = 0;

function paintStars() { document.querySelectorAll('#stars span').forEach((s, i) => s.classList.toggle('got', i < stars)); }

function deal() {
  const s = nextSum(games.ask);
  clearApples();
  Object.assign(ask, { sum: s, apples: [], total: s.a + s.b, onTray: 0, misses: 0, busy: false, tidying: false, pending: null, run: 0 });
  [chips.n1, chips.n2, chips.total, chips.op, chips.eq].forEach(el => el.classList.remove('hide'));
  chips.n1.textContent = s.a; paintChip(chips.n1, s.c1);
  chips.n2.textContent = s.b; paintChip(chips.n2, s.c2);
  chips.total.textContent = '?'; plainChip(chips.total, true);
  numrow.classList.remove('inert');
  numrow.querySelectorAll('button').forEach(b => b.classList.remove('good', 'soft'));
  [[1, s.a, s.c1, $('#zone1')], [2, s.b, s.c2, $('#zone2')]].forEach(([group, n, c, zone]) => {
    for (let i = 0; i < n; i++) {
      const a = makeApple(c); Object.assign(a, { group, zone, n, i, at: { t: 'home' } });
      setPos(a, homePos(zone, n, i), 0); popIn(a, (group - 1) * 150 + i * 40);
      ask.apples.push(a);
    }
  });
}

// One tap, one object, one count. Notes only: he counts himself.
function askTapApple(a) {
  if (ask.busy) return;
  if (a.at.t === 'home') {
    a.at = { t: 'queued' };
    enqueue(async () => {
      const slot = ask.onTray++;
      a.at = { t: 'tray', slot };
      await hop(a, trayPos(slot));
      squash(a); sfx.note(slot + 1);
    });
  } else if (a.at.t === 'tray') {
    touchCount(ask, a);
  }
}
// Touching is counting: a wiggle and the next note up, no number. After a pause the run starts again. Both question games.
function touchCount(st, a) {
  st.run = Math.min(st.run + 1, 15);
  wiggle(a.face); sfx.note(st.run);
  clearTimeout(st.runTimer); st.runTimer = setTimeout(() => { st.run = 0; }, 1800);
}

// If the colours ended up mixed, slide them into first group, then second group. If not, nothing moves.
async function tidy() {
  const on = ask.apples.filter(a => a.at.t === 'tray').sort((p, q) => p.at.slot - q.at.slot);
  const want = on.filter(a => a.group === 1).concat(on.filter(a => a.group === 2));
  let moved = false;
  want.forEach((a, i) => { if (a.at.slot !== i) { a.at.slot = i; setPos(a, trayPos(i), 420); moved = true; } });
  if (moved) { sfx.slide(); await sleep(470); }
}
// The proof moves groups, not single objects: each group slides onto the tray in one piece, first group first.
async function bringRest(g) {
  for (const group of [1, 2]) {
    const rest = ask.apples.filter(a => a.group === group && a.at.t === 'home');
    if (!rest.length) continue;
    rest.forEach(a => { const slot = ask.onTray++; a.at = { t: 'tray', slot }; setPos(a, trayPos(slot), 460); });
    sfx.slide(); await sleep(500);
    if (g !== gen) return;
  }
}
async function askIdle() {
  const g = gen;
  if (ask.onTray === ask.total && !ask.busy) { ask.tidying = true; await tidy(); if (g !== gen) return; ask.tidying = false; }
  if (ask.pending != null && !ask.busy) { const n = ask.pending; ask.pending = null; evaluate(n); }
}

// He may answer at any moment, even before moving a single object. In take away, once the question has arrived.
function answer(n) {
  const st = mode === 'take' ? take : ask;
  if (st.busy || (st === take && !take.asked)) return;
  if (Q.pending > 0 || st.tidying) { st.pending = n; return; }
  if (st === take) takeEvaluate(n); else evaluate(n);
}

async function evaluate(n) {
  const g = gen, btn = numrow.querySelector(`button[data-n="${n}"]`);
  ask.busy = true; ask.pending = null; numrow.classList.add('inert');
  clearTimeout(ask.runTimer); ask.run = 0;

  if (n !== ask.total) {
    // A miss: no buzzer, no red cross. First a slow recount with notes only, from the second miss on with numbers.
    ask.misses++;
    sfx.boop(); btn.classList.remove('soft'); void btn.offsetWidth; btn.classList.add('soft');
    await sleep(350); if (g !== gen) return;
    await bringRest(g); if (g !== gen) return;
    await tidy(); if (g !== gen) return;
    await recount(g, ask.apples.slice().sort((p, q) => p.at.slot - q.at.slot), ask.misses >= 2); if (g !== gen) return;
    ask.busy = false; numrow.classList.remove('inert');
    return;
  }

  sfx.chord(); btn.classList.add('good');
  chips.total.textContent = ask.total; plainChip(chips.total, false); pulse(chips.total, 1.3, 350);
  await bringRest(g); if (g !== gen) return;
  await tidy(); if (g !== gen) return;
  if (ask.total === 10) { sfx.fanfare(); glowCells(0, 10); bits('✨', centre(cells[0]), centre(cells[9]), 10); await sleep(700); if (g !== gen) return; }
  await readBack(g, askBeats()); if (g !== gen) return;
  await giveStar(g); if (g !== gen) return;
  sumSolved(games.ask, ask.misses >= 2);
  if (stars >= 5) {
    await trophy(); if (g !== gen) return;
    stars = 0; paintStars();
    setIdx = (setIdx + 1) % SETS.length;   // a new object as a treat, never inside one sum
  }
  await sleep(150); if (g !== gen) return;
  deal();
}

// About one object per second up to 5, quicker for bigger totals, never more than about 6 seconds in all.
// row is what gets counted: everything in addition, what is left on the tray in take away.
async function recount(g, row, withNumbers) {
  const step = Math.min(1000, 6000 / row.length);
  await sleep(250);
  for (let i = 0; i < row.length; i++) {
    if (g !== gen) return;
    bounce(row[i], step * .7); sfx.note(i + 1);
    let said = null;
    if (withNumbers) { showNum(row[i], i + 1, Math.max(650, step * .95)); said = sayNumber(i + 1); }
    await Promise.all([sleep(step), said]);   // the count never runs ahead of the voice
  }
  // The last number is said once more with the big numeral: it is how many there are, not the name of the last one.
  if (withNumbers && g === gen) { if (VOICE) sayNumber(row.length); await showBig(row.length); }
}

// The one place where the symbols get tied to the things, so it happens every time.
// It is also where the words come in. The sentence is said in one breath, and each beat starts as the
// voice gets to its part, so every word lands with its numeral and its group.
// Each beat pulses a numeral with its group. bright: faded cars that brighten for the beat. also: anything else the beat shows.
const askBeats = () => [
  { chip: chips.n1,    group: ask.apples.filter(a => a.group === 1), k: 1.35, ms: 600, text: WORDS[ask.sum.a] },
  { chip: chips.n2,    group: ask.apples.filter(a => a.group === 2), k: 1.35, ms: 600, text: `${SAYING.and} ${WORDS[ask.sum.b]}` },
  { chip: chips.total, group: ask.apples,                            k: 1.5,  ms: 700, text: `${SAYING.make} ${WORDS[ask.total]}` },
];
async function readBack(g, beats) {
  const talk = voiceOn(), slow = talk ? 100 : 0;
  const voice = say(beats.map(b => b.text));
  for (let i = 0; i < beats.length; i++) {
    const b = beats[i], ms = b.ms + slow;
    if (i) await voice.reach[i];   // the first beat does not wait: a voice that fails to start must not leave a hole
    if (g !== gen) return;
    pulse(b.chip, b.k, ms); b.group.forEach(a => pulse(a.face, 1.25, ms)); sfx.read(i, talk);
    (b.bright || []).forEach(a => anim(a.el, [{ opacity: .55 }, { opacity: 1 }, { opacity: .55 }], { duration: ms }));
    if (b.also) b.also();
    await sleep(i === beats.length - 1 ? ms + 50 : ms); if (g !== gen) return;
  }
  await voice.done;
}

// A solved sum always earns its star, even after a miss.
async function giveStar(g) {
  const slot = document.querySelectorAll('#stars span')[stars], from = centre(chips.total), to = centre(slot);
  const s = document.createElement('div'); s.className = 'bit'; s.textContent = '⭐'; s.style.fontSize = U * .7 + 'px';
  s.style.margin = `${-U * .35}px 0 0 ${-U * .35}px`; layer.appendChild(s);
  anim(s, [{ transform: `translate(${from.x}px, ${from.y}px) scale(.3)` }, { transform: `translate(${lerp(from.x, to.x, .5)}px, ${Math.min(from.y, to.y) - U * .6}px) scale(1.5)`, offset: .5 }, { transform: `translate(${to.x}px, ${to.y}px) scale(.7)` }], { duration: 500, easing: 'ease-in-out' });
  await sleep(500); s.remove();
  if (g !== gen) return;
  stars++; paintStars(); sfx.ting(); pulse(slot, 1.6, 350);
  await sleep(300);
}
function trophy() {
  return new Promise(done => {
    const box = $('#trophy'), t0 = performance.now();
    box.classList.add('on'); sfx.fanfare(); confetti(70);
    const tap = () => {
      if (performance.now() - t0 < 1200) return;
      box.removeEventListener('pointerdown', tap); box.classList.remove('on'); done();
    };
    box.addEventListener('pointerdown', tap);
  });
}

/* ==================== ➖ How many left? ==================== */
// The whole is on the tray. He taps cars away into waiting places under the number that must go, then taps how many
// are left. The gone cars stay in sight, faded: he sees 5 as 3 on the tray and 2 gone, the picture he knows from 3 + 2 = 5.
const take = { sum: null, apples: [], whole: 0, taken: 0, gone: [], places: [], asked: false, askTimer: 0, misses: 0, busy: false, pending: null, run: 0, runTimer: 0 };
const placePos = i => homePos($('#zone2'), take.taken, i);
const onTray = () => take.apples.filter(a => a.at.t === 'tray').sort((p, q) => p.at.slot - q.at.slot);
const inPlaces = () => take.apples.filter(a => a.at.t === 'place');
const fade   = (a, ms = 250) => { a.el.classList.add('gone');    anim(a.el, [{ opacity: 1 }, { opacity: .55 }], { duration: ms }); };
const unfade = (a, ms = 250) => { a.el.classList.remove('gone'); anim(a.el, [{ opacity: .55 }, { opacity: 1 }], { duration: ms }); };
const popChip = el => anim(el, [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300 });
function clearPlaces() { take.places.forEach(p => p.remove()); take.places = []; }

// Here are 5: the whole appears under its numeral and slides onto the tray as one group. Nothing is counted for him.
function takeDeal() {
  const s = nextSum(games.take);
  clearApples(); clearPlaces(); clearTimeout(take.askTimer);
  Object.assign(take, { sum: s, apples: [], whole: s.w, taken: s.t, gone: Array(s.t).fill(null), asked: false, misses: 0, busy: false, pending: null, run: 0 });
  chips.n1.textContent = s.w; paintChip(chips.n1, 0); chips.n1.classList.remove('hide');
  chips.n2.textContent = s.t; paintChip(chips.n2, 0); chips.n2.classList.add('gone');
  chips.total.textContent = '?'; plainChip(chips.total, true);
  [chips.op, chips.n2, chips.eq, chips.total].forEach(el => el.classList.add('hide'));   // the sentence shows just the whole for now
  numrow.classList.add('inert');
  numrow.querySelectorAll('button').forEach(b => b.classList.remove('good', 'soft'));
  const zone = $('#zone1');
  for (let i = 0; i < s.w; i++) {
    const a = makeApple(0); Object.assign(a, { zone, n: s.w, i, at: { t: 'home' } });
    setPos(a, homePos(zone, s.w, i), 0); popIn(a, i * 40);
    take.apples.push(a);
  }
  enqueue(async () => {
    const g = gen;
    await sleep(450 + s.w * 40); if (g !== gen) return;
    take.apples.forEach((a, i) => { a.at = { t: 'tray', slot: i }; setPos(a, trayPos(i), 460); });
    sfx.slide(); await sleep(500); if (g !== gen) return;
    takeWait();
  });
}
// The question waits a moment after the whole has landed, and every touch on a car restarts the wait, so he can count
// the whole in peace and a car never leaves mid-count. A second and a half is a guess, to be tuned by watching him.
function takeWait() {
  clearTimeout(take.askTimer);
  if (!take.asked) take.askTimer = setTimeout(takeAsk, 1500);
}
// "− 2 = ?" pops into the sentence, and two empty places pop in under the 2, one after the other, with a tok each.
// Two places, two must go. From this moment a touch on a car on the tray takes it away, and the number row wakes up.
function takeAsk() {
  take.asked = true;
  enqueue(async () => {
    const g = gen;
    [chips.op, chips.n2, chips.eq, chips.total].forEach(el => { el.classList.remove('hide'); popChip(el); });
    const gap = Math.min(180, 900 / take.taken);
    for (let i = 0; i < take.taken; i++) {
      const p = document.createElement('div'); p.className = 'place'; layer.appendChild(p); take.places.push(p);
      const at = placePos(i); p.style.transform = T(at);
      anim(p, [{ transform: T({ ...at, s: 0 }) }, { transform: T({ ...at, s: at.s * 1.2 }) }, { transform: T(at) }], { duration: 300 });
      sfx.tok();
      await sleep(gap); if (g !== gen) return;
    }
    numrow.classList.remove('inert');
  });
}

// One tap, one car, one rule: a car only goes where there is a place for it, and a car with nowhere to go is counted.
function takeTapApple(a) {
  if (take.busy) return;
  if (a.at.t === 'place') {
    // Undo: it hops back onto the tray and plays the tray's count. He took one too many, or changed his mind, and it costs nothing.
    take.gone[a.at.i] = null; a.at = { t: 'fly' };
    enqueue(async () => {
      const slot = onTray().length;
      a.at = { t: 'tray', slot }; unfade(a);
      await hop(a, trayPos(slot));
      squash(a); sfx.note(slot + 1);
    });
    return;
  }
  if (a.at.t !== 'tray') return;
  if (!take.asked) { touchCount(take, a); takeWait(); return; }   // before the question: touching is counting, and the question waits
  const i = take.gone.indexOf(null);
  if (i < 0) { touchCount(take, a); return; }                      // the places are full: touching is counting, as in "How many?"
  // It hops up into the next place, the tray closes the gap behind it, and the note says how many are now in the places.
  take.gone[i] = a; a.at = { t: 'fly' };
  enqueue(async () => {
    takeTidy();
    await hop(a, placePos(i));
    a.at = { t: 'place', i }; fade(a);
    squash(a); sfx.note(inPlaces().length);
  });
}
// The tray closes the gap behind a car that leaves, so the rows of 5 stay true.
function takeTidy(ms = 260) {
  onTray().forEach((a, i) => { if (a.at.slot !== i) { a.at.slot = i; setPos(a, trayPos(i), ms); } });
}
// The proof moves a group: the cars that must go slide up into the places together, with one slide sound. Only his own
// taps move cars one at a time. The ones that go are the last on the tray, so what is left stays at the front.
async function takeProof() {
  const empty = take.gone.map((a, i) => a ? -1 : i).filter(i => i >= 0);
  if (!empty.length) return;
  const on = onTray();
  on.slice(on.length - empty.length).forEach((a, k) => {
    const i = empty[k]; take.gone[i] = a; a.at = { t: 'place', i }; fade(a, 460); setPos(a, placePos(i), 460);
  });
  sfx.slide(); await sleep(500);
}
function takeIdle() {
  if (take.pending != null && !take.busy) { const n = take.pending; take.pending = null; takeEvaluate(n); }
}

async function takeEvaluate(n) {
  const g = gen, btn = numrow.querySelector(`button[data-n="${n}"]`), left = take.whole - take.taken;
  take.busy = true; take.pending = null; numrow.classList.add('inert');
  clearTimeout(take.runTimer); take.run = 0;

  if (n !== left) {
    // A miss: no buzzer, no red cross. Any places still empty get filled, then what is left is counted, with numbers from the second miss on.
    take.misses++;
    sfx.boop(); btn.classList.remove('soft'); void btn.offsetWidth; btn.classList.add('soft');
    await sleep(350); if (g !== gen) return;
    await takeProof(); if (g !== gen) return;
    await takeRecount(g, take.misses >= 2); if (g !== gen) return;
    take.busy = false; numrow.classList.remove('inert');
    return;
  }

  sfx.chord(); btn.classList.add('good');
  chips.total.textContent = left; paintChip(chips.total, 0); pulse(chips.total, 1.3, 350);
  await takeProof(); if (g !== gen) return;
  await readBack(g, takeBeats()); if (g !== gen) return;
  await giveStar(g); if (g !== gen) return;
  sumSolved(games.take, take.misses >= 2);
  if (stars >= 5) {
    await trophy(); if (g !== gen) return;
    stars = 0; paintStars();
    setIdx = (setIdx + 1) % SETS.length;   // a new object as a treat, never inside one sum
  }
  await sleep(150); if (g !== gen) return;
  takeDeal();
}
// The help counts what is left, never the whole and never the gone ones, because "how many are left" is the question.
// When nothing is left, the help is the empty tray itself: a glow, and from the second miss on the big 0.
async function takeRecount(g, withNumbers) {
  const row = onTray();
  if (row.length) return recount(g, row, withNumbers);
  await sleep(250); if (g !== gen) return;
  glowCells(0, take.whole); sfx.slide();
  await sleep(900); if (g !== gen) return;
  if (withNumbers) { if (VOICE) sayNumber(0); await showBig(0); }
}
// The read-back: 5 with all five cars (the faded ones brighten for the beat), 2 with the gone ones, 3 with the tray.
// For all gone, the empty tray glows for its beat.
function takeBeats() {
  const gone = inPlaces(), on = onTray(), left = take.whole - take.taken;
  return [
    { chip: chips.n1,    group: take.apples, bright: gone, k: 1.35, ms: 600, text: WORDS[take.whole] },
    { chip: chips.n2,    group: gone,        bright: gone, k: 1.35, ms: 600, text: `take away ${WORDS[take.taken]}` },
    { chip: chips.total, group: on,                        k: 1.5,  ms: 700, text: `leaves ${WORDS[left]}`, also: left ? null : () => glowCells(0, take.whole) },
  ];
}
/* ==================== modes, the parent dial, taps ==================== */
function setMode(m) {
  mode = m; newGen(); clearApples(); clearPlaces(); hideHand();
  clearTimeout(ask.runTimer); clearTimeout(take.runTimer); clearTimeout(take.askTimer);
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#zone1').innerHTML = ''; $('#zone2').innerHTML = '';
  const isPlay = m === 'play', isTake = m === 'take', mem = (isTake ? games.take : games.ask).mem;
  document.body.classList.toggle('play', isPlay);
  $('#stars').classList.toggle('hide', isPlay);
  $('#tumble').classList.toggle('hide', !isPlay);
  numrow.classList.toggle('hide', isPlay);
  chips.op.textContent = isTake ? '−' : '+';
  chips.n2.classList.remove('gone');
  $('#dial span').textContent = mem.level;   // Play has no level: there the dial shows and changes the addition level
  if (isPlay) {
    buildTray(2); buildNumrow(1, 10, false);
    play.list = []; play.reserved = 0;
    paintChip(chips.n1, 0); paintChip(chips.n2, 1); plainChip(chips.total, false);
    buildPiles(); playSentence(false);
  } else {
    const A = mem.level === 'A';
    buildTray(A ? 1 : 2); buildNumrow(isTake ? 0 : 1, A ? 5 : 10, A);   // Level A: totals up to 5, top row only. Take away has a 0 at the left.
    games[m].seq.sub = 0;
    if (isTake) takeDeal(); else deal();
  }
}

document.querySelectorAll('.mode').forEach(b => b.addEventListener('pointerdown', () => { if (b.dataset.mode !== mode) { sfx.tok(); setMode(b.dataset.mode); } }));
layer.addEventListener('pointerdown', e => {
  const el = e.target.closest('.apple'); if (!el) return;
  if (mode === 'play') playRemove(el._a); else if (mode === 'ask') askTapApple(el._a); else takeTapApple(el._a);
});
$('#zones').addEventListener('pointerdown', e => { const p = e.target.closest('.pile'); if (p && mode === 'play') playAdd(+p.dataset.c); });
$('#tumble').addEventListener('pointerdown', () => { if (mode === 'play') playTumble(); });
numrow.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (b && mode !== 'play') answer(+b.dataset.n); });

// The parent dial: press and hold, so he does not flip it by accident.
(() => {
  const dial = $('#dial'); let timer = 0;
  const stop = () => { clearTimeout(timer); dial.classList.remove('holding'); };
  dial.addEventListener('pointerdown', () => {
    dial.classList.add('holding');
    timer = setTimeout(() => {
      stop();
      const g = games[mode === 'take' ? 'take' : 'ask'];   // in Play, the addition level
      g.mem.level = g.mem.level === 'A' ? 'B' : 'A'; save(); resetSeq(g); sfx.ting(); setMode(mode);
    }, 900);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => dial.addEventListener(ev, stop));
})();

/* ---------- the pointing hand: a short demo when nothing happens for a while ---------- */
const hand = $('#hand'); let lastTouch = performance.now(), handAnim = null;
function hideHand() { hand.style.opacity = 0; if (handAnim) { handAnim.cancel(); handAnim = null; } }
function showHand() {
  const st = mode === 'take' ? take : ask;
  if (mode !== 'play' && (st.busy || Q.pending)) return;
  let from, to, glyph = '👆';
  const sweep = () => {   // sweep along the whole number row, never point at one number
    const bs = numrow.querySelectorAll('button'); glyph = '👇';
    from = centre(bs[0]); to = centre(bs[bs.length - 1]);
    from.y -= U * 1.1; to.y -= U * 1.1;
  };
  if (mode === 'play') {
    if (play.reserved > 0) return;
    from = to = centre(play.piles[0]);
  } else if (mode === 'ask') {
    const home = ask.apples.find(a => a.at.t === 'home');
    if (home) from = to = home.pos; else sweep();   // everything is on the tray
  } else {
    if (!take.asked) return;
    const car = take.gone.includes(null) ? take.apples.find(a => a.at.t === 'tray') : null;   // a place is empty: point at a car
    if (car) from = to = car.pos; else sweep();
  }
  hand.textContent = glyph; hand.style.opacity = 1;
  const dx = -U * .5, dy = glyph === '👆' ? U * .1 : 0, tap = U * .18;
  const at = (p, k) => ({ transform: `translate(${p.x + dx}px, ${p.y + dy + k * tap}px)` });
  handAnim = from === to
    ? anim(hand, [at(from, 1), at(from, 0), at(from, 1), at(from, 0), at(from, 1)], { duration: 2000, easing: 'ease-in-out' })
    : anim(hand, [at(from, 0), at(to, 0), at(from, 0)], { duration: 3200, easing: 'ease-in-out' });
  if (handAnim) handAnim.onfinish = () => { hand.style.opacity = 0; lastTouch = performance.now() - 1500; };
}
addEventListener('pointerdown', () => { audio(); lastTouch = performance.now(); hideHand(); }, true);
// iOS only lets sound start from the end of a touch, so the audio and the voice are woken up there
['pointerup', 'touchend', 'click'].forEach(ev => addEventListener(ev, () => { audio(); wakeVoice(); }, true));
setInterval(() => {
  if (handAnim && handAnim.playState === 'running') return;
  if ($('#trophy').classList.contains('on')) return;
  if (performance.now() - lastTouch > 5000) showHand();
}, 1000);

/* ---------- no zoom, no menus ---------- */
['gesturestart', 'contextmenu', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));

paintStars();
fit();
setMode('play');

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
